[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-music-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=22,<23",
    "python-dotenv>=1.1,<2",
    "yt-dlp[default]>=2025.8.27",
    "httpx>=0.27,<0.29",
    "mutagen>=1.47,<2",
    "librosa>=0.10,<1",
    "numpy>=1.24,<3",
]

[project.scripts]
music-bot = "music_bot.bot:main"

[tool.setuptools.packages.find]
include = ["music_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
